const DEPT="EMB",E=window.EVENTS;
const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const now=new Date(),todayIso=iso(now),mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
const jobs=E.jobs.filter(j=>j.depts.includes(DEPT));
document.getElementById('meta').textContent=jobs.length+' tickets · snapshot '+E.snapshot_at;
function lum(h){h=h.replace('#','');const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return .299*r+.587*g+.114*b}
function render(w){
 document.getElementById('bm1').className=w===-1?'on':'';document.getElementById('b0').className=w===0?'on':'';document.getElementById('b1').className=w===1?'on':'';
 const days=[];for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+w*7+i);days.push(d)}
 const show=days.filter((d,i)=>i<5||jobs.some(j=>j.d==iso(d)));
 const g=document.getElementById('g');g.style.setProperty('--n',show.length);g.innerHTML='';
 show.forEach(d=>{const k=iso(d),L=jobs.filter(j=>j.d==k).sort((a,b)=>b.r-a.r||a.i-b.i);
  const c=document.createElement('div');c.className='day'+(k==todayIso?' today':'');
  c.innerHTML='<div class="dh"><span>'+d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+'</span><span>'+L.length+'</span></div>'+
  (L.length?L.map(j=>{const dark=lum(j.c)>170;return '<a class="ev'+(j.r?' rush':'')+'" target="_blank" href="https://www.printavo.com/invoices/'+j.iid+'" style="background:'+j.c+(dark?';color:#111;text-shadow:none':'')+'">'+(j.r?'<span class="tag">RUSH</span>':'')+'<b>#'+j.i+'</b> '+esc(j.n)+(j.depts.length>1?' <i>['+j.b+']</i>':'')+'<span class="s">'+esc(j.s)+'</span></a>'}).join(''):'<div class="empty">—</div>');
  g.appendChild(c)})}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
